server:
  port: 8080

spring:
  application:
    name: ingester

  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    email-event:
      exchange: ${RABBITMQ_EMAIL_EVENT_EXCHANGE}
      routing-key: ${RABBITMQ_EMAIL_SANITIZATION_ROUTING_KEY}
    label-event:
      exchange: ${RABBITMQ_LABEL_EVENT_EXCHANGE}
      apply-queue: ${RABBITMQ_LABEL_APPLY_QUEUE}
      apply-routing-key: ${RABBITMQ_LABEL_APPLY_ROUTING_KEY}

resilience4j:
  retry:
    instances:
      gmailRetry:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.inboxintelligence.ingester.exception.RetryableGmailApiException

gmail-api:
  application-name: "InboxIntelligence"
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  token-url: "https://oauth2.googleapis.com/token"
  scope: "openid email https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.labels https://www.googleapis.com/auth/gmail.modify"
  pubsub-topic: ${GCP_PUBSUB_TOPIC}
  project-id: ${GCP_PROJECT_ID}
  pubsub-subscription-id: ${GCP_PUBSUB_SUBSCRIPTION_ID}
  service-account-key-path: ${GCP_SERVICE_ACCOUNT_KEY_PATH:./gcp-service-account.json}

email-storage-provider:
  name: ${EMAIL_STORAGE_PROVIDER_NAME}
  local-base-path: ${EMAIL_STORAGE_LOCAL_BASE_PATH}

logging:
  level:
    root: WARN
    com.inboxintelligence: INFO
    com.inboxintelligence.ingester: INFO
    org.springframework: WARN
    org.springframework.amqp: WARN
    org.springframework.boot: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
